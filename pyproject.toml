[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-toolbox"
version = "0.1.0"
description = "Reusable utilities for scientific computing and computational biology research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
evaluation = ["pandas>=2.0", "scikit-learn>=1.3"]
chemistry = ["rdkit>=2023.9"]
visualization = ["matplotlib>=3.7"]
torch = ["torch>=2.0"]
all = [
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "rdkit>=2023.9",
    "matplotlib>=3.7",
    "torch>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "research_toolbox*",
    "biomed*",
    "caching*",
    "chemistry*",
    "evaluation*",
    "reproducibility*",
    "visualization*",
]
